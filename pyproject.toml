[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twincert"
version = "0.1.0"
description = "An ODE used as a prior: the 5-FU example for the mechanistic-priors paper"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Anonymous" }]
keywords = ["digital twins", "bandits", "pharmacokinetics", "information theory"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
